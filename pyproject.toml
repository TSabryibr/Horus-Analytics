[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horus-analytics"
version = "1.0.0"
description = "Institutional-grade technical market scanner, analytics, and execution engine for the Egyptian Stock Exchange (EGX)."
authors = [
    { name = "Horus Analytics Team" }
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "slowapi>=0.1.9",
    "starlette>=0.41.0",
    "APScheduler>=3.11.0",
    "peewee>=3.18.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "duckdb>=1.2.0",
    "pyarrow>=18.0.0",
    "fastparquet>=2024.11.0",
    "orjson>=3.10.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "tenacity>=9.0.0",
    "watchdog>=6.0.0",
    "watchfiles>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-requests>=2.32.0",
    "types-python-dateutil>=2.9.0",
    "types-PyYAML>=6.0.0",
]

# -----------------------------------------------------------------------------
# RUFF CONFIGURATION
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    ".venv313",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "frontend",
    ".pytest_cache",
    ".ms-playwright",
    "tmp",
    ".tmp",
    "scratch",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise ... from err (progressive adoption)
    "UP006", # non-pep585-annotation (maintain runtime peewee/python compat)
    "UP035", # deprecated imports
    "E402",  # module level import not at top of file
    "F401",  # unused imports (some re-exports in __init__)
    "F403",  # star imports in legacy modules
    "F405",  # star import names
]

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "data_engine", "database", "routes", "utils", "api"]

# -----------------------------------------------------------------------------
# MYPY CONFIGURATION
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "frontend/",
    "build/",
    "dist/",
    ".venv/",
    "scratch/",
]

# Strict type checks on domain enums & core definitions
[[tool.mypy.overrides]]
module = "core.domain_enums"
disallow_untyped_defs = true
disallow_incomplete_defs = true

