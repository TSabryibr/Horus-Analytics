apiVersion: apps/v1
kind: Deployment
metadata:
  name: horus-frontend
  labels:
    app: horus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: horus-frontend
  template:
    metadata:
      labels:
        app: horus-frontend
    spec:
      containers:
      - name: frontend
        image: horus-analytics-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://horus-backend-svc:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: horus-frontend-svc
spec:
  selector:
    app: horus-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
